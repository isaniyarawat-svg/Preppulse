<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrepPulse - Cyber Academic Engine</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel Compiler CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .neon-glow-indigo { box-shadow: 0 0 25px -5px rgba(99, 102, 241, 0.4); }
    .neon-glow-pink { box-shadow: 0 0 25px -5px rgba(236, 72, 153, 0.4); }
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('resources');
      const [jokeIndex, setJokeIndex] = useState(0);
      const [cramMode, setCramMode] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');

      // 1. Pomodoro Timer State
      const [timerSeconds, setTimerSeconds] = useState(25 * 60);
      const [isTimerRunning, setIsTimerRunning] = useState(false);

      // 2. Interactive Flashcard State
      const [flashcardIndex, setFlashcardIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [cardScore, setCardScore] = useState({ learned: 0, review: 0 });

      // 3. New Topic Modal / Input State
      const [newModuleName, setNewModuleName] = useState('');
      const [newYieldType, setNewYieldType] = useState('High Yield 🔥');

      const flashcards = [
        {
          question: "What is Boyce-Codd Normal Form (BCNF)?",
          answer: "A relation is in BCNF if for every non-trivial functional dependency X → Y, X is a super key."
        },
        {
          question: "What is the primary difference between Stack and Heap memory?",
          answer: "Stack allocates static execution frames in contiguous memory (fast, LIFO), while Heap handles dynamic allocation (flexible, slower, requires pointers)."
        },
        {
          question: "What does the ACID acronym stand for in Databases?",
          answer: "Atomicity, Consistency, Isolation, and Durability."
        }
      ];

      const dailyJokes = [
        { setup: "Why do programmers prefer dark mode?", punchline: "Because light attracts bugs!" },
        { setup: "There are 10 types of people in the world...", punchline: "Those who understand binary, and those who don't." },
        { setup: "Topper Pro-Tip:", punchline: "'Write code on paper before exams—compiler error messages won't save you on answer sheets!'" }
      ];

      const [modules, setModules] = useState([
        {
          id: 1,
          module: "Unit 1: Relational Model & Advanced SQL",
          yieldType: "High Yield 🔥",
          isCritical: true,
          progress: 85,
          resources: [
            { title: "Relational Algebra Cheat Sheet", type: "PDF Notes", link: "#" },
            { title: "2023-2025 Solved PYQ Bank", type: "PYQ", link: "#" }
          ]
        },
        {
          id: 2,
          module: "Unit 2: Normalization (3NF / BCNF / 4NF)",
          yieldType: "Must Pass ⚡",
          isCritical: true,
          progress: 40,
          resources: [
            { title: "Lossless Join & FD Decomposition Drive", type: "Drive", link: "#" },
            { title: "Topper Anomaly Resolution Steps", type: "Topper Notes", link: "#" }
          ]
        },
        {
          id: 3,
          module: "Unit 3: Transaction Control & Recovery Protocols",
          yieldType: "Medium Yield 💡",
          isCritical: false,
          progress: 20,
          resources: [
            { title: "ACID & Two-Phase Locking (2PL) Lab Code", type: "Code", link: "#" }
          ]
        }
      ]);

      // Timer Effect
      useEffect(() => {
        let interval = null;
        if (isTimerRunning && timerSeconds > 0) {
          interval = setInterval(() => setTimerSeconds(prev => prev - 1), 1000);
        } else if (timerSeconds === 0) {
          setIsTimerRunning(false);
        }
        return () => clearInterval(interval);
      }, [isTimerRunning, timerSeconds]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeTab, jokeIndex, cramMode, modules, isFlipped, isTimerRunning]);

      // Dynamic calculation
      const overallReadiness = Math.round(
        modules.reduce((acc, curr) => acc + curr.progress, 0) / (modules.length || 1)
      );

      const handleProgressChange = (id, newProgress) => {
        setModules(modules.map(m => m.id === id ? { ...m, progress: Number(newProgress) } : m));
      };

      const handleAddModule = (e) => {
        e.preventDefault();
        if (!newModuleName.trim()) return;
        const newEntry = {
          id: Date.now(),
          module: newModuleName,
          yieldType: newYieldType,
          isCritical: newYieldType.includes('High') || newYieldType.includes('Must'),
          progress: 0,
          resources: [{ title: `${newModuleName} Overview Notes`, type: "Drive", link: "#" }]
        };
        setModules([...modules, newEntry]);
        setNewModuleName('');
      };

      const formatTime = (secs) => {
        const mins = Math.floor(secs / 60);
        const remainderSecs = secs % 60;
        return `${mins.toString().padStart(2, '0')}:${remainderSecs.toString().padStart(2, '0')}`;
      };

      const filteredModules = modules
        .filter(m => cramMode ? m.isCritical : true)
        .filter(m => m.module.toLowerCase().includes(searchQuery.toLowerCase()));

      return (
        <div className="min-h-screen p-4 md:p-8 max-w-7xl mx-auto space-y-6">
          {/* HEADER BAR */}
          <header className="glass-panel p-6 rounded-3xl border border-slate-800 flex flex-col md:flex-row justify-between items-center gap-6 neon-glow-indigo">
            <div className="space-y-1 text-center md:text-left">
              <div className="flex items-center justify-center md:justify-start gap-3">
                <span className="p-2 bg-indigo-600/30 rounded-xl border border-indigo-500/40 text-indigo-400">
                  <i data-lucide="zap" className="w-6 h-6"></i>
                </span>
                <h1 className="text-3xl font-extrabold tracking-tight text-white flex items-center gap-2">
                  PrepPulse <span className="text-xs font-mono bg-indigo-500/20 text-indigo-300 px-2.5 py-1 rounded-full border border-indigo-500/30">v3.0 INTERACTIVE</span>
                </h1>
              </div>
              <p className="text-slate-400 text-sm">
                Live Study Timers • Concept Drill Cards • Syllabus Control Center
              </p>
            </div>

            {/* Pomodoro Focus Control */}
            <div className="flex items-center gap-4 bg-slate-900/90 border border-slate-800 p-3 rounded-2xl">
              <div className="text-center font-mono">
                <span className="text-[10px] text-slate-400 uppercase tracking-widest block">Focus Timer</span>
                <span className="text-2xl font-black text-indigo-400">{formatTime(timerSeconds)}</span>
              </div>
              <div className="flex gap-2">
                <button 
                  onClick={() => setIsTimerRunning(!isTimerRunning)}
                  className={`p-2.5 rounded-xl font-bold transition cursor-pointer ${isTimerRunning ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'bg-indigo-600 text-white shadow-lg'}`}
                >
                  <i data-lucide={isTimerRunning ? "pause" : "play"} className="w-4 h-4"></i>
                </button>
                <button 
                  onClick={() => { setIsTimerRunning(false); setTimerSeconds(25 * 60); }}
                  className="p-2.5 bg-slate-800 text-slate-400 hover:text-white rounded-xl border border-slate-700 transition cursor-pointer"
                >
                  <i data-lucide="rotate-ccw" className="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </header>

          {/* DASHBOARD WIDGETS */}
          <section className="grid grid-cols-1 md:grid-cols-3 gap-6">
            {/* Mode Switcher */}
            <div className="glass-panel p-5 rounded-3xl border border-slate-800 flex flex-col justify-between space-y-4">
              <div>
                <span className="text-xs font-mono text-indigo-400 uppercase tracking-widest font-bold">Execution Strategy</span>
                <h3 className="text-lg font-bold text-white mt-1">Syllabus Mode</h3>
                <p className="text-xs text-slate-400 mt-1">
                  {cramMode ? "Showing only Must-Pass High-Yield topics." : "Standard study plan."}
                </p>
              </div>

              <div className="flex bg-slate-900/80 p-1 rounded-2xl border border-slate-800">
                <button 
                  onClick={() => setCramMode(false)}
                  className={`flex-1 py-2 rounded-xl text-xs font-bold transition cursor-pointer ${!cramMode ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}
                >
                  Topper Mode 🎓
                </button>
                <button 
                  onClick={() => setCramMode(true)}
                  className={`flex-1 py-2 rounded-xl text-xs font-bold transition cursor-pointer ${cramMode ? 'bg-rose-600 text-white shadow-lg neon-glow-pink' : 'text-slate-400 hover:text-white'}`}
                >
                  24h Cram Mode 🚨
                </button>
              </div>
            </div>

            {/* Daily Stress Buster Widget */}
            <div className="md:col-span-2 glass-panel p-5 rounded-3xl border border-slate-800 flex flex-col justify-between bg-gradient-to-r from-indigo-950/40 via-slate-900 to-purple-950/40 relative overflow-hidden">
              <div className="flex justify-between items-start gap-4">
                <div className="space-y-2">
                  <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-mono font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20">
                    <i data-lucide="sparkles" className="w-3.5 h-3.5"></i> Academic Humor
                  </span>
                  <p className="text-base font-semibold text-slate-100">"{dailyJokes[jokeIndex].setup}"</p>
                  <p className="text-sm font-bold text-indigo-300 font-mono">→ {dailyJokes[jokeIndex].punchline}</p>
                </div>
                <button 
                  onClick={() => setJokeIndex((jokeIndex + 1) % dailyJokes.length)}
                  className="p-2.5 bg-slate-800/80 hover:bg-slate-700 text-slate-300 rounded-2xl border border-slate-700 transition cursor-pointer"
                >
                  <i data-lucide="dice-5" className="w-5 h-5"></i>
                </button>
              </div>
              <div className="text-[11px] text-slate-500 font-mono mt-4">
                Overall Exam Readiness: <span className="text-emerald-400 font-bold">{overallReadiness}%</span>
              </div>
            </div>
          </section>

          {/* MAIN TABS */}
          <nav className="flex gap-3 border-b border-slate-800/80 pb-3">
            <button 
              onClick={() => setActiveTab('resources')}
              className={`flex items-center gap-2 px-5 py-2.5 rounded-2xl text-xs font-bold transition cursor-pointer ${activeTab === 'resources' ? 'bg-indigo-600 text-white neon-glow-indigo' : 'text-slate-400 hover:bg-slate-900'}`}
            >
              <i data-lucide="folder-git-2" className="w-4 h-4"></i> Syllabus & Drive Vault
            </button>
            <button 
              onClick={() => setActiveTab('quiz')}
              className={`flex items-center gap-2 px-5 py-2.5 rounded-2xl text-xs font-bold transition cursor-pointer ${activeTab === 'quiz' ? 'bg-indigo-600 text-white neon-glow-indigo' : 'text-slate-400 hover:bg-slate-900'}`}
            >
              <i data-lucide="brain" className="w-4 h-4"></i> Interactive Drills
            </button>
          </nav>

          {/* TAB 1: SYLLABUS, SEARCH & ADD */}
          {activeTab === 'resources' && (
            <div className="space-y-6">
              {/* Search & Add Bar */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div className="md:col-span-2 relative">
                  <input 
                    type="text" 
                    placeholder="Search topics, modules, or notes..." 
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 pl-10 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition"
                  />
                  <i data-lucide="search" className="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                </div>

                <form onSubmit={handleAddModule} className="flex gap-2">
                  <input 
                    type="text" 
                    placeholder="+ Add New Topic" 
                    value={newModuleName}
                    onChange={(e) => setNewModuleName(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-800 rounded-2xl px-3 text-xs text-slate-200 focus:outline-none focus:border-indigo-500"
                  />
                  <button type="submit" className="bg-indigo-600 hover:bg-indigo-500 text-white px-4 rounded-2xl text-xs font-bold transition cursor-pointer">
                    Add
                  </button>
                </form>
              </div>

              {/* Module List */}
              <div className="space-y-4">
                {filteredModules.map((item) => (
                  <div key={item.id} className="glass-panel p-6 rounded-3xl border border-slate-800 space-y-4 hover:border-slate-700 transition">
                    <div className="flex flex-col md:flex-row justify-between md:items-center gap-4">
                      <div>
                        <div className="flex items-center gap-2 mb-1">
                          <span className="text-[11px] font-mono font-bold px-2.5 py-0.5 rounded-md bg-amber-500/10 text-amber-400 border border-amber-500/20">
                            {item.yieldType}
                          </span>
                        </div>
                        <h3 className="text-lg font-bold text-white">{item.module}</h3>
                      </div>

                      {/* Interactive Mastery Slider */}
                      <div className="flex items-center gap-4 bg-slate-900/90 p-3 rounded-2xl border border-slate-800 min-w-[240px]">
                        <span className="text-xs font-mono text-slate-400">Mastery:</span>
                        <input 
                          type="range" 
                          min="0" 
                          max="100" 
                          value={item.progress} 
                          onChange={(e) => handleProgressChange(item.id, e.target.value)}
                          className="w-full accent-indigo-500 bg-slate-800 rounded-lg cursor-pointer h-2"
                        />
                        <span className="text-xs font-mono font-bold text-indigo-400 w-10 text-right">{item.progress}%</span>
                      </div>
                    </div>

                    {/* Resource Links */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
                      {item.resources.map((res, rIdx) => (
                        <a 
                          key={rIdx} 
                          href={res.link} 
                          className="flex items-center justify-between p-3.5 bg-slate-900/60 rounded-2xl border border-slate-800/80 hover:border-indigo-500/50 hover:bg-slate-900 transition group"
                        >
                          <div className="flex items-center gap-3">
                            <span className="p-2 bg-indigo-500/10 rounded-xl text-indigo-400 group-hover:bg-indigo-500 group-hover:text-white transition">
                              <i data-lucide="file-text" className="w-4 h-4"></i>
                            </span>
                            <div>
                              <span className="text-xs font-mono text-slate-400 block">{res.type}</span>
                              <span className="text-sm font-semibold text-slate-200 group-hover:text-indigo-300">
                                {res.title}
                              </span>
                            </div>
                          </div>
                          <i data-lucide="arrow-up-right" className="w-4 h-4 text-slate-500 group-hover:text-indigo-400 transition"></i>
                        </a>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* TAB 2: INTERACTIVE FLASHCARD QUIZ */}
          {activeTab === 'quiz' && (
            <div className="max-w-2xl mx-auto space-y-6">
              <div className="flex justify-between items-center text-xs font-mono text-slate-400">
                <span>Card {flashcardIndex + 1} of {flashcards.length}</span>
                <span className="text-emerald-400 font-bold">Score: {cardScore.learned} Mastered</span>
              </div>

              {/* Flip Card */}
              <div 
                onClick={() => setIsFlipped(!isFlipped)}
                className="glass-panel min-h-[220px] p-8 rounded-3xl border border-slate-800 flex flex-col justify-center items-center text-center cursor-pointer hover:border-indigo-500/50 transition relative"
              >
                <span className="text-[10px] font-mono uppercase tracking-widest text-indigo-400 mb-3">
                  {isFlipped ? "Answer / Solution" : "Tap to reveal answer"}
                </span>
                <p className="text-lg font-bold text-white">
                  {isFlipped ? flashcards[flashcardIndex].answer : flashcards[flashcardIndex].question}
                </p>
              </div>

              {/* Controls */}
              <div className="flex justify-center gap-4">
                <button 
                  onClick={() => {
                    setCardScore({ ...cardScore, review: cardScore.review + 1 });
                    setIsFlipped(false);
                    setFlashcardIndex((flashcardIndex + 1) % flashcards.length);
                  }}
                  className="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-2xl text-xs font-bold transition cursor-pointer"
                >
                  Needs Review ❌
                </button>
                <button 
                  onClick={() => {
                    setCardScore({ ...cardScore, learned: cardScore.learned + 1 });
                    setIsFlipped(false);
                    setFlashcardIndex((flashcardIndex + 1) % flashcards.length);
                  }}
                  className="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-2xl text-xs font-bold transition cursor-pointer shadow-lg"
                >
                  Got It! ✅
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
